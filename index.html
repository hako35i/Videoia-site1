<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Générateur de Vidéo IA - Luma & Gemini</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at top right, rgba(139, 92, 246, 0.15), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1), transparent 50%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 12px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], input[type="password"], select, textarea {
      width: 100%;
      padding: 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      background: rgba(15, 23, 42, 0.3);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .upload-zone input {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .preview-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      display: none;
      margin: 0 auto;
      object-fit: contain;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: white;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .video-container {
      display: none;
      margin-top: 15px;
    }

    video {
      width: 100%;
      border-radius: 16px;
      background: black;
      max-height: 400px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .ios-tip {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 0 auto 12px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Video AI Generator</h1>
      <p>Transformez vos images en vidéos HD animées</p>
    </header>

    <!-- Clé API -->
    <div class="card">
      <div class="form-group">
        <label for="apiKey">Clé API (Agnes / Luma / Gemini)</label>
        <input type="password" id="apiKey" placeholder="Entrez votre clé API ici">
      </div>
    </div>

    <!-- Configuration Génération -->
    <div class="card">
      <div class="form-group">
        <label>Image Source</label>
        <div class="upload-zone" id="uploadZone">
          <span id="uploadText">📷 Toucher pour choisir une image de la pellicule</span>
          <img id="preview" class="preview-img" alt="Aperçu">
          <input type="file" id="imageInput" accept="image/*">
        </div>
      </div>

      <div class="form-group">
        <label for="prompt">Description de l'animation (Prompt)</label>
        <textarea id="prompt" rows="3" placeholder="Ex: Mouvement de caméra lent, vent léger dans les cheveux, style cinématique..."></textarea>
      </div>

      <div class="form-group">
        <label for="duration">Durée de la vidéo (Maximale)</label>
        <select id="duration">
          <option value="5">5 secondes (Standard)</option>
          <option value="10">10 secondes (Étendu)</option>
          <option value="15" selected>15 secondes (Maximale)</option>
          <option value="30">30 secondes (Boucle Seamless HD)</option>
        </select>
      </div>

      <button class="btn btn-primary" id="generateBtn" onclick="generateVideo()">
        🎬 Générer la Vidéo IA
      </button>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p id="statusText">Génération en cours... Veuillez patienter.</p>
      </div>
    </div>

    <!-- Résultat & Enregistrement -->
    <div class="card video-container" id="resultCard">
      <label>Vidéo Générée</label>
      <video id="videoResult" controls playsinline loop></video>

      <div class="actions">
        <button class="btn btn-success" id="shareBtn" onclick="saveToIPhone()">
          📱 Enregistrer dans Photos (iPhone)
        </button>
        <button class="btn btn-secondary" onclick="downloadVideo()">
          ⬇️ Télécharger le fichier (.mp4)
        </button>
      </div>
      <p class="ios-tip">💡 Sur iPhone : Si le bouton ne s'ouvre pas, faites un appui long sur la vidéo puis "Enregistrer dans Photos".</p>
    </div>
  </div>

  <script>
    let currentVideoBlob = null;
    let selectedImageBase64 = null;

    // Gestion du sélecteur d'image
    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          selectedImageBase64 = evt.target.result;
          const preview = document.getElementById('preview');
          preview.src = selectedImageBase64;
          preview.style.display = 'block';
          document.getElementById('uploadText').style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    });

    // Sauvegarder/charger la clé API localement
    const apiKeyInput = document.getElementById('apiKey');
    apiKeyInput.value = localStorage.getItem('ai_video_api_key') || '';
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('ai_video_api_key', apiKeyInput.value);
    });

    // Génération de la vidéo
    async function generateVideo() {
      const apiKey = apiKeyInput.value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const duration = document.getElementById('duration').value;

      if (!apiKey) {
        alert("Veuillez saisir votre clé API.");
        return;
      }

      if (!selectedImageBase64) {
        alert("Veuillez sélectionner une image.");
        return;
      }

      const generateBtn = document.getElementById('generateBtn');
      const loading = document.getElementById('loading');
      const resultCard = document.getElementById('resultCard');

      generateBtn.style.display = 'none';
      loading.style.display = 'block';
      resultCard.style.display = 'none';

      try {
        // Envoi de la requête au serveur / API
        // Remarque: simulation d'attente pour la création vidéo
        await new Promise(resolve => setTimeout(resolve, 4000));

        // Démo vidéo d'illustration (remplacée par le rendu réel selon votre endpoint API)
        const sampleVideoUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
        const response = await fetch(sampleVideoUrl);
        currentVideoBlob = await response.blob();

        const videoResult = document.getElementById('videoResult');
        videoResult.src = URL.createObjectURL(currentVideoBlob);

        loading.style.display = 'none';
        generateBtn.style.display = 'flex';
        resultCard.style.display = 'block';

        videoResult.play();
      } catch (err) {
        alert("Erreur lors de la génération : " + err.message);
        loading.style.display = 'none';
        generateBtn.style.display = 'flex';
      }
    }

    // Sauvegarde directe sur iPhone (iOS Web Share API)
    async function saveToIPhone() {
      if (!currentVideoBlob) return;

      const file = new File([currentVideoBlob], `video_ia_${Date.now()}.mp4`, { type: 'video/mp4' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Ma vidéo IA',
            text: 'Vidéo générée avec IA'
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            alert("Erreur lors du partage : " + err.message);
          }
        }
      } else {
        downloadVideo();
      }
    }

    // Téléchargement direct
    function downloadVideo() {
      if (!currentVideoBlob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(currentVideoBlob);
      a.download = `video_ia_${Date.now()}.mp4`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
